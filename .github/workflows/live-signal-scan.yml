# Hobby Vercel only allows 1 cron/day — use GitHub Actions for hourly live Telegram scans.
# Repo secrets required:
#   SCAN_URL     = https://YOUR_DEPLOYMENT.vercel.app/api/scan
#   CRON_SECRET  = same value as Vercel CRON_SECRET
name: Live signal scan

on:
  schedule:
    # Every 15m (Hobby Vercel can't) — catch 1h closes within ~5–15 minutes, not 1–2h late
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger live scan (Telegram = fresh closed bars only)
        env:
          SCAN_URL: ${{ secrets.SCAN_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SCAN_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set repo secrets SCAN_URL and CRON_SECRET"
            exit 1
          fi
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SCAN_URL}?notify=1" \
            -o /tmp/scan.json
          python -c "import json; d=json.load(open('/tmp/scan.json')); print('notify', d.get('notifyCount'), 'recent', d.get('recentCount'), 'tf', d.get('timeframe'))"
